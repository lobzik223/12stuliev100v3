<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Test - Sections Check</title>
  <style>
    body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: sans-serif; }
    .section { margin: 20px 0; padding: 20px; border: 2px solid #FBC632; }
    img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
    .info { color: #FBC632; font-size: 14px; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Проверка загрузки фонов/PNG для мобилки</h1>
  
  <div class="section">
    <h2>Section 1 (Hero)</h2>
    <img src="/backgrounds/sections/section-1.png" alt="section-1" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
  </div>
  
  <div class="section">
    <h2>Section 2 (Events)</h2>
    <img src="/backgrounds/sections/section-2.png" alt="section-2" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
    <img src="/backgrounds/sections/plitkanovosti.png" alt="plitkanovosti" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
  </div>
  
  <div class="section">
    <h2>Section 3 (Actors/Team)</h2>
    <img src="/backgrounds/sections/section-3.png" alt="section-3" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
  </div>
  
  <div class="section">
    <h2>Section 4 (Journey/Team)</h2>
    <img src="/backgrounds/sections/section-4.png" alt="section-4" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
  </div>
  
  <div class="section">
    <h2>Journey elements</h2>
    <img src="/backgrounds/sections/vput.png" alt="vput" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
    <img src="/backgrounds/sections/vput2.png" alt="vput2" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
    <img src="/backgrounds/sections/vput3.png" alt="vput3" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
    <img src="/backgrounds/sections/vput4.png" alt="vput4" onload="this.nextElementSibling.textContent='✓ Загружен'" onerror="this.nextElementSibling.textContent='✗ Ошибка'">
    <div class="info">Загрузка...</div>
  </div>

  <script>
    // Проверяем viewport
    document.body.innerHTML += '<div class="section"><h2>Device Info</h2>' +
      '<div class="info">innerWidth: ' + window.innerWidth + '</div>' +
      '<div class="info">screen.width: ' + window.screen.width + '</div>' +
      '<div class="info">visualViewport: ' + (window.visualViewport ? window.visualViewport.width : 'N/A') + '</div>' +
      '<div class="info">matchMedia (max-width:768px): ' + window.matchMedia('(max-width: 768px)').matches + '</div>' +
      '<div class="info">touchPoints: ' + navigator.maxTouchPoints + '</div>' +
      '<div class="info">UA: ' + navigator.userAgent.substring(0, 100) + '</div>' +
      '</div>';
  </script>
</body>
</html>
